name: Release

# Publica quando o arquivo VERSION muda na main (ou numa tag v* criada à mão).
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; nada a fazer."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        if: env.SKIP != '1'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP != '1'

      - name: Preparar keystore
        if: env.SKIP != '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltam os secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK de release assinado
        if: env.SKIP != '1'
        env:
          VELAR_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          VELAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VELAR_KEY_ALIAS: velarcall
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${TAG#v}"
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "VelarCall-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "VelarCall-${TAG}.aab"

      - name: Publicar no Releases
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "VelarCall-${TAG}.apk" "VelarCall-${TAG}.aab" \
            --target "$GITHUB_SHA" \
            --title "VelarCall ${TAG}" \
            --notes "APK (instalar direto) e AAB (Play Store) assinados do VelarCall ${TAG}. Requer Android 10 ou superior." \
            --prerelease
