name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltam os secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK de release assinado
        env:
          VELAR_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          VELAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VELAR_KEY_ALIAS: velarcall
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "VelarCall-${GITHUB_REF_NAME}.apk"

      - name: Publicar no Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "VelarCall-${GITHUB_REF_NAME}.apk" \
            --title "VelarCall ${GITHUB_REF_NAME}" \
            --notes "APK assinado do VelarCall ${GITHUB_REF_NAME}. Requer Android 10 ou superior." \
            --prerelease
